<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Maine Ledger · Confirm your email</title>
<meta name="description" content="Confirm your email to finish signing up for The Maine Ledger.">
<meta name="robots" content="noindex">

<meta property="og:description" content="Confirm your email to finish signing up for The Maine Ledger.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://themaineledger.com/thanks.html">
<meta name="theme-color" content="#f6f2e8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{height:100%}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:#f6f2e8;color:#151311;font:17px/1.5 'Source Serif 4',Georgia,'Times New Roman',serif}
a{color:#151311}
.w{max-width:1080px;margin:0 auto;padding:0 22px}

.notice-strip{border-bottom:1px solid #151311;padding:8px 16px;text-align:center;font-size:14px;line-height:1.4;letter-spacing:.03em;text-wrap:balance}
.notice-strip b{color:#9e2a1b;text-transform:uppercase;letter-spacing:.12em;font-size:13px}

.masthead{padding-top:18px;text-align:center}
.mast-row{text-align:center}
.nameplate{font-family:'Source Serif 4',Georgia,serif;font-weight:700;font-size:68px;line-height:1;margin:0;letter-spacing:-.015em;white-space:nowrap;font-optical-sizing:auto}
.dateline{margin-top:12px;border-top:3px double #151311;border-bottom:1px solid #151311;display:flex;justify-content:center;gap:12px;padding:5px 2px;font-size:13px;text-transform:uppercase;letter-spacing:.1em}
.edition{display:flex;align-items:center;justify-content:center;gap:14px;margin:8px 0 0;font:600 13px/1.2 'Source Serif 4',Georgia,serif;text-transform:uppercase;letter-spacing:.32em;color:#3a362f;padding-left:.32em}
.edition::before,.edition::after{content:"";width:44px;height:1px;background:#151311;opacity:.6}

main{flex:1}
.thanks{padding:64px 0 96px;text-align:center;max-width:34em;margin:0 auto}
.sub-h{font:600 28px/1.15 'Source Serif 4',Georgia,serif;margin:0 0 12px;letter-spacing:-.01em}
.deck{font-style:italic;font-size:18px;color:#3a362f;margin:0 0 28px}
.home a{font-size:15px;color:#5d584f;text-decoration:none;border-bottom:1px solid #c9c2b6}
.home a:hover{color:#151311;border-color:#151311}

.site-nav{border-bottom:1px solid #151311}
.site-nav ul{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px 18px;list-style:none;margin:0;padding:10px 0}
.site-nav a{color:#3a362f;text-decoration:none;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.site-nav a:hover,.site-nav a:focus-visible{color:#151311}
.site-nav a[aria-current="page"]{color:#151311;box-shadow:inset 0 -1px 0 #151311}
.site-foot{border-top:1px solid #151311;padding:14px 0 36px;font-size:13px;text-align:center;color:#3a362f}
.site-foot a{color:#151311}

footer{border-top:1px solid #151311;padding:14px 0 36px;font-size:13px;text-align:center;color:#3a362f}

@media(max-width:700px){
  .nameplate{font-size:10.6vw}
  .dateline{font-size:11px;letter-spacing:.06em}
  .edition{font-size:11px;letter-spacing:.26em;gap:10px}
  .edition::before,.edition::after{width:28px}
  .sub-h{font-size:26px}
  .thanks{padding:48px 0 72px}
}
</style>
</head>
<body>
<div class="notice-strip" role="status"><b>Still in beta</b>, not ready for the public yet.</div>
<header class="w masthead">
  <div class="mast-row">
    <h1 class="nameplate" id="top-title">The Maine Ledger</h1>
  </div>
  <div class="edition" id="edition">Midcoast Editions</div>
  <div class="dateline"><span class="dl-date" id="today"></span></div>
</header>
<nav class="site-nav" aria-label="Site">
  <div class="w">
    <ul>
      <li><a href="/" aria-current="page">Subscribe</a></li>
      <li><a href="/archive/">Archive</a></li>
      <li><a href="/advertise/">Advertise</a></li>
      <li><a href="/about/">About</a></li>
    </ul>
  </div>
</nav>
<main class="w">
  <section class="thanks">
    <h2 class="sub-h">You're almost done.</h2>
    <p class="deck">Check your inbox and confirm your email to finish signing up.</p>
    <p class="home"><a href="/">Back home</a></p>
  </section>
</main>
<footer class="site-foot"><div class="w">© 2026 The Maine Ledger · <a href="mailto:ben@themaineledger.com">ben@themaineledger.com</a></div></footer>
<script>
(function(){
  try{document.getElementById('today').textContent=new Date().toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric',timeZone:'America/New_York'})}catch(e){}
})();
</script>
</body>
</html>
