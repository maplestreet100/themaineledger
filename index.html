<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Maine Ledger (beta, not ready for the public yet)</title>
<meta name="description" content="The Maine Ledger, a free daily email for the Brunswick area. Still in beta and not ready for the public yet.">
<meta property="og:title" content="The Maine Ledger · Brunswick Edition">
<meta property="og:description" content="Town business &amp; good news from Brunswick. A free daily email.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://themaineledger.com/">
<link rel="canonical" href="https://themaineledger.com/">
<meta name="theme-color" content="#f6f2e8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#f6f2e8;color:#151311;font:17px/1.5 'Source Serif 4',Georgia,'Times New Roman',serif}
a{color:#151311}
.w{max-width:1080px;margin:0 auto;padding:0 22px}
.sc{font-variant:small-caps;letter-spacing:.06em}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}

/* —— Beta notice: plain printed notice —— */
.notice-strip{border-bottom:1px solid #151311;padding:8px 16px;text-align:center;font-size:14px;line-height:1.4;letter-spacing:.03em;text-wrap:balance}
.notice-strip b{color:#9e2a1b;text-transform:uppercase;letter-spacing:.12em;font-size:13px}

/* —— Masthead —— */
.masthead{padding-top:18px;text-align:center}
.mast-row{text-align:center}
.nameplate{font-family:'Source Serif 4',Georgia,serif;font-weight:700;font-size:68px;line-height:1;margin:0;letter-spacing:-.015em;white-space:nowrap;font-optical-sizing:auto}
.dateline{margin-top:12px;border-top:3px double #151311;border-bottom:1px solid #151311;display:flex;justify-content:space-between;gap:12px;padding:5px 2px;font-size:13px;text-transform:uppercase;letter-spacing:.1em}
.dateline{justify-content:center}
.edition{display:flex;align-items:center;justify-content:center;gap:14px;margin:8px 0 0;font:600 13px/1.2 'Source Serif 4',Georgia,serif;text-transform:uppercase;letter-spacing:.32em;color:#3a362f;padding-left:.32em}
.edition::before,.edition::after{content:"";width:44px;height:1px;background:#151311;opacity:.6}

/* —— Front page —— */
.front{display:grid;gap:26px;padding:22px 0 30px}
.front > *{min-width:0}
.col-rule{border-left:1px solid #151311;padding-left:26px}
.kicker{font-size:12px;text-transform:uppercase;letter-spacing:.16em;font-weight:600;border-bottom:1px solid #151311;padding-bottom:4px;margin:0 0 10px}
h1{font:700 34px/1.08 'Source Serif 4',Georgia,serif;margin:0 0 10px;letter-spacing:-.01em}
.sub-h{font:700 30px/1.1 'Source Serif 4',Georgia,serif;margin:0 0 6px;letter-spacing:-.01em}
.deck{font-style:italic;font-size:18px;color:#3a362f;margin:0 0 14px}
.body p{margin:0 0 12px}

/* Map */
.map-fig{margin:0}
.map-stage{position:relative;width:100%;aspect-ratio:1000 / 1390;border:1px solid #151311;background:#efebe3;overflow:hidden}
.me-svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.lab-sea{font:italic 400 26px 'Source Serif 4',Georgia,serif;fill:#7d8786;letter-spacing:1px}
.lab-state{font:600 34px 'Source Serif 4',Georgia,serif;fill:#8a8378;letter-spacing:22px}
.lab-scale{font:400 15px 'Source Serif 4',Georgia,serif;fill:#3d3a34}
.lab-n{font:600 15px 'Source Serif 4',Georgia,serif;fill:#3d3a34}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
.pin{position:absolute;transform:translate(-50%,calc(-100% - 10px));padding:0;margin:0;border:0;background:none;font:inherit;color:inherit;cursor:pointer;z-index:3}
.pin-card{display:block;background:#fbf8f1;border:1px solid #151311;padding:4px 10px;text-align:center;line-height:1.1;white-space:nowrap}
.pin-name{display:block;font:600 16px 'Source Serif 4',Georgia,serif;letter-spacing:.01em}
.pin::after{content:"";position:absolute;left:50%;bottom:-10px;width:1.5px;height:10px;background:#151311}
.pin:hover .pin-card,.pin:focus-visible .pin-card{background:#151311;color:#f6f2e8}
.pin:focus-visible{outline:none}
.pin-brunswick{left:80.00%;top:75.54%}
figcaption{font-size:13px;font-style:italic;color:#3a362f;margin-top:6px;border-bottom:1px solid #151311;padding-bottom:6px}
figcaption .src{color:#7a746a}


/* Signup */
form{display:flex;flex-wrap:nowrap;gap:0;margin:14px 0 0}
input[type=email]{flex:1 1 0;min-width:0;width:0;padding:12px;font:inherit;font-size:16px;border:1px solid #151311;border-right:0;background:#fffdf8;color:#151311;border-radius:0}
input[type=email]:focus{outline:2px solid #151311;outline-offset:-2px}
button[type=submit]{flex:none;padding:12px 16px;font:700 15px 'Source Serif 4',Georgia,serif;text-transform:uppercase;letter-spacing:.12em;background:#151311;color:#f6f2e8;border:1px solid #151311;border-radius:0;cursor:pointer}
button[type=submit]:hover{background:#3a362f}
.fine{font-size:13px;color:#5d584f;margin:6px 0 0;font-style:italic}
.current{margin-top:26px}
.current-text{margin:0;font-weight:700;font-size:19px}
.current .fine{margin-top:4px}

footer{border-top:1px solid #151311;padding:14px 0 36px;font-size:13px;text-align:center;color:#3a362f}

@media(min-width:880px){
  .front{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:0}
  .front > .map-col{padding-right:26px}
}
@media(max-width:879px){
  .front > .sub-col{order:-1}
  .col-rule{border-left:0;padding-left:0}
}
@media(max-width:700px){
  .nameplate{font-size:10.6vw}
  .dateline{font-size:11px;letter-spacing:.06em}
  .edition{font-size:11px;letter-spacing:.26em;gap:10px}
  .edition::before,.edition::after{width:28px}
  h1{font-size:28px}
  .pin-name{font-size:14px}}
</style>
</head>

  pin.addEventListener('click',function(){document.getElementById('signup').scrollIntoView({block:'center'});email.focus({preventScroll:true})});
})();
</script>
